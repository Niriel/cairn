<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in to Cairn</title>
</head>
<body style="margin:0;padding:0;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="center" style="padding:40px 24px;font-family:sans-serif;color:#111;">
        <table width="480" cellpadding="0" cellspacing="0" border="0">
          <tr>
            <td style="padding-bottom:8px;">
              <h2 style="margin:0;">Cairn</h2>
            </td>
          </tr>
          <tr>
            <td style="padding-bottom:32px;">
              Tap the link below to sign in.
            </td>
          </tr>
          <tr>
            <td style="padding-bottom:32px;">
              <table cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td bgcolor="#111" style="padding:12px 24px;">
                    <a href="{{ .ConfirmationURL }}"
                       style="color:#fff;text-decoration:none;">
                      <b>Sign in to Cairn</b>
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="font-size:14px;color:#666;">
              If you didn't request this, you can safely ignore this e-mail.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>

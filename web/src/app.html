<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
		<!-- theme-color pair tracks the --paper token in each scheme (computed
		     sRGB of oklch(98% 0.012 85) / oklch(20% 0.012 70)). -->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fcf8f0" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1510" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="mobile-web-app-capable" content="yes" />
		<!-- FOUC-prevent boot script: applies theme + font-size before first paint.
		     Keep storage keys ('cairn.theme', 'cairn.font_size') and the SCALE map
		     in sync with lib/shared/state/preferences.svelte.ts — both files are
		     sources of truth for the same constants. -->
		<script>
			try {
				const t = localStorage.getItem('cairn.theme');
				if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
				const f = localStorage.getItem('cairn.font_size');
				const SCALE = { xs: 0.85, s: 0.92, m: 1.0, l: 1.1, xl: 1.22 };
				if (f && SCALE[f])
					document.documentElement.style.setProperty('--font-size-scale', String(SCALE[f]));
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

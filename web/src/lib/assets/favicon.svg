<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
	<title>Cairn</title>
	<!-- Opaque paper field + accent glyph, using the computed sRGB hex of the
	     light paper / accent tokens. A favicon has no app-stylesheet context,
	     so var()/currentColor would render black. -->
	<rect width="24" height="24" fill="#fcf8f0" />
	<g fill="#6e4e27">
		<ellipse cx="12" cy="19" rx="9" ry="2.6" />
		<ellipse cx="11.2" cy="13.5" rx="6.3" ry="2.4" />
		<ellipse cx="12.6" cy="8.5" rx="3.6" ry="2.0" />
		<circle cx="12.2" cy="4.6" r="1.1" />
	</g>
</svg>

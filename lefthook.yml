# Cairn pre-commit / pre-push hooks. See docs/quality.md for rationale.
# Register once per clone: `lefthook install`.
#
# pre-commit runs on staged files only — fast, fails early.
# pre-push runs the slower test suites once before the push goes out.
# Playwright is intentionally NOT in pre-push — it's CI-only.

pre-commit:
  parallel: true
  commands:
    eslint:
      root: 'web/'
      glob: 'web/**/*.{ts,js,svelte}'
      # --no-error-on-unmatched-pattern: don't fail when a staged file
      # matches an ignore pattern in eslint.config.js — just skip it.
      run: pnpm exec eslint --no-error-on-unmatched-pattern {staged_files}
    prettier:
      root: 'web/'
      glob: 'web/**/*.{ts,js,svelte,css,json,md,yaml,yml}'
      # --ignore-unknown skips files Prettier doesn't know how to format
      # or that are listed in .prettierignore.
      run: pnpm exec prettier --check --ignore-unknown {staged_files}
    svelte-check:
      root: 'web/'
      glob: 'web/**/*.{ts,svelte}'
      run: pnpm check
    eslint-sidecar:
      root: 'sidecar/'
      glob: 'sidecar/**/*.{ts,js}'
      run: pnpm exec eslint --no-error-on-unmatched-pattern {staged_files}
    prettier-sidecar:
      root: 'sidecar/'
      glob: 'sidecar/**/*.{ts,js,json,yaml,yml}'
      run: pnpm exec prettier --check --ignore-unknown {staged_files}
    eslint-auth-proxy:
      root: 'auth-proxy/'
      glob: 'auth-proxy/**/*.{ts,js}'
      run: pnpm exec eslint --no-error-on-unmatched-pattern {staged_files}
    prettier-auth-proxy:
      root: 'auth-proxy/'
      glob: 'auth-proxy/**/*.{ts,js,json,yaml,yml}'
      run: pnpm exec prettier --check --ignore-unknown {staged_files}
    sqlfluff:
      glob: '{db,scripts}/**/*.sql'
      run: sqlfluff lint {staged_files}
    shellcheck:
      glob: 'scripts/**/*.sh'
      run: shellcheck {staged_files}
    shfmt:
      glob: 'scripts/**/*.sh'
      run: shfmt -d -i 2 -ci -bn {staged_files}

pre-push:
  parallel: false
  commands:
    test-db:
      run: ./scripts/test-db.sh
    vitest:
      root: 'web/'
      run: pnpm test
    vitest-auth-proxy:
      root: 'auth-proxy/'
      run: pnpm test

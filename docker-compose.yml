services:
  postgres:
    build:
      context: ./db
    environment:
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cairn
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cairn -d cairn"]
      interval: 2s
      timeout: 3s
      retries: 20

  postgrest:
    image: postgrest/postgrest:v12.2.3
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@postgres:5432/cairn
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  gotrue:
    image: supabase/gotrue:v2.158.1
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://gotrue:${GOTRUE_PASSWORD}@postgres:5432/cairn?search_path=auth
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      # Short-lived access JWT (5 min): the BFF mints these on demand from the
      # durable refresh token, so the bearer's security value is bounded by this
      # exp, not by the cookie's Max-Age. Refresh-token rotation issues a fresh
      # refresh token on every exchange and rejects a replayed already-used token.
      # Reuse interval (seconds) is the grace window for a benign retry of a
      # just-rotated token; 30 s comfortably covers multi-tab boot + clock skew.
      # (Reuse detection on this GoTrue is rejection-only, not family-revoke —
      # see docs/architecture.md "JWT storage".)
      GOTRUE_JWT_EXP: "300"
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: "30"
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  sidecar:
    build: ./sidecar
    environment:
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      POSTGREST_URL: http://postgrest:3000
      AVATARS_DIR: /srv/cairn/avatars
      PORT: "3001"
    volumes:
      - avatars:/srv/cairn/avatars
    depends_on:
      postgrest:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3001/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  caddy:
    image: caddy:2.9.1
    volumes:
      - avatars:/srv/cairn/avatars:ro

volumes:
  postgres_data:
  avatars:

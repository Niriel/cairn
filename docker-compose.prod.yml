# Production overlay — invoked explicitly with
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml ...
# Naming the files explicitly suppresses the auto-load of
# docker-compose.override.yml, so none of the dev-only services/ports
# (static, mailpit, public Postgres/PostgREST/GoTrue) reach production.
# This overlay adds only what prod needs on top of the prod-safe base.
services:
  postgres:
    # Loopback-only publish so migrate.sh can reach localhost:5432. This is
    # the only published port besides Caddy's, and binding to 127.0.0.1 keeps
    # it off the internet even though Docker bypasses ufw's INPUT filter.
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped

  gotrue:
    environment:
      # GoTrue reads this without the GOTRUE_ prefix (envconfig quirk).
      API_EXTERNAL_URL: https://cairn.${DOMAIN}/auth
      GOTRUE_SITE_URL: https://cairn.${DOMAIN}
      GOTRUE_DISABLE_SIGNUP: "${DISABLE_SIGNUP:-true}"
      # Load-bearing for the password grant, not a dev convenience: the BFF's
      # /auth/register flow signs up against the non-deliverable
      # <uid>@cairn.internal identity, so a confirmation e-mail could never be
      # delivered and clicked. Autoconfirm makes the account immediately usable.
      # E-mail verification instead happens later and optionally, when a user
      # proves a recovery address (BFF-orchestrated). Matches dev.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: "${SMTP_PORT}"
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_FROM}
      GOTRUE_SMTP_SENDER_NAME: Cairn
    restart: unless-stopped

  auth-proxy:
    build: ./auth-proxy
    environment:
      GOTRUE_URL: http://gotrue:9999
      POSTGREST_URL: http://postgrest:3000
      PORT: "3002"
      COOKIE_SECURE: "true"
      # The BFF sends recovery mail itself (GoTrue can't reach the non-deliverable
      # <uid>@cairn.internal identity), so it reads the same SMTP_* env as the
      # gotrue service above. Dev points these at Mailpit; prod at the real relay.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      # Pre-minted role JWT carrying {"role":"cairn_auth_bff"}, signed with the
      # GoTrue JWT_SECRET — the scoped credential for the signed-out reset RPCs
      # (request_password_reset / reset_password), which are granted ONLY to that
      # role. High-value secret (a reset-takeover primitive): env-only, never
      # logged, rotatable. Mint with scripts/mint-bff-jwt.sh (see .env.prod.example).
      AUTH_BFF_DB_JWT: ${AUTH_BFF_DB_JWT}
    depends_on:
      - gotrue
      - postgrest
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3002/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  web:
    build: ./web
    depends_on:
      - postgrest
    restart: unless-stopped

  caddy:
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - avatars:/srv/cairn/avatars:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
